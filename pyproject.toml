[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftgame"
version = "0.7.0"
description = "Mechanically abstract full-map League of Legends macro simulator for multi-agent self-play research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
experiments = ["numpy>=2.0"]
pilot = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["riftgame*"]

[tool.setuptools.package-data]
riftgame = ["rulesets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = ["."]
