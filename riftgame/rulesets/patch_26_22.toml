# Reference ruleset for League of Legends patch 26.22 (live 2026-11-04), Summoner's Rift.
#
# Every value line ends with a status tag. tests/test_ruleset.py enforces this.
#   F2  read this session on two independent pages (wiki plus Riot patch notes)
#   F1  read this session on one page
#   D   derived by arithmetic from F values
#   M   from memory, not confirmed on any fetched page
#   A   simulator assumption, not a game fact
# Sources, one link per value: docs/reference/patch_26_22_timing_and_economy.md and patch_26_22_map_and_structures.md.
# Conflicts and omissions: docs/design/M7_architecture.md, section 3.
# Units: seconds, League distance units, gold, XP.

